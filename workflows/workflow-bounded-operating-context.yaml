id: 7e27da20-3c21-4aff-b494-2831a4c0124c
name: "@mgreten/bounded-operating-context"
description: >-
  Compile durable policy context and a time-bounded operating packet from
  minimized cited entries. It does not invoke providers, call the network, or
  take an external side effect.
tags:
  capability: bounded-operating-context
  boundary: reference-only-no-provider-no-side-effect
inputs:
  type: object
  additionalProperties: false
  properties:
    packetId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$' }
    generatedAt: { type: string, format: date-time }
    expiresAt: { type: string, format: date-time }
    contextCompilerModel: { type: string, pattern: '^[A-Za-z0-9@][A-Za-z0-9._/@:-]{0,199}$' }
    constitution:
      type: object
      additionalProperties: false
      properties:
        artifactId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$' }
        version: { type: string, minLength: 1, maxLength: 2000 }
        policyRef: { type: string, minLength: 1, maxLength: 2000 }
        observedAt: { type: string, format: date-time }
        contentDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        cited: { const: true }
        minimized: { const: true }
      required: [artifactId, version, policyRef, observedAt, contentDigest, cited, minimized]
    entries:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        properties:
          entryId: { type: string, minLength: 1, maxLength: 200 }
          kind: { type: string, minLength: 1, maxLength: 100 }
          summary: { type: string, minLength: 1, maxLength: 2000 }
          confidence: { enum: [low, medium, high] }
          sensitivity: { enum: [public, internal, confidential, restricted] }
          observedAt: { type: string, format: date-time }
          expiresAt: { type: string, format: date-time }
          sourceRef: { type: string, minLength: 1, maxLength: 2000 }
          sourceVersion: { type: string, minLength: 1, maxLength: 2000 }
          cited: { const: true }
          minimized: { const: true }
        required: [entryId, kind, summary, confidence, sensitivity, observedAt, expiresAt, sourceRef, sourceVersion, cited, minimized]
    contentAttestation: { const: minimized-no-secrets-no-private-content }
    replayPolicy: { const: reject-conflicting-replay }
    authorityAttestation: { const: reference-only-advisory-no-authority }
  required: [packetId, generatedAt, expiresAt, contextCompilerModel, constitution, entries, contentAttestation, replayPolicy, authorityAttestation]
jobs:
  - name: compile-operating-context
    description: Compile durable policy context independently before compiling the current bounded packet.
    steps:
      - name: validate-dynamic-identifiers
        description: Reject identifiers containing whitespace, traversal, or expression syntax before method dispatch.
        task:
          type: assert
          expr: inputs.contextCompilerModel.matches('^[A-Za-z0-9@][A-Za-z0-9._/@:-]{0,199}$')
          message: The dynamic model identifier must use the bounded safe identifier syntax.
          severity: high
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: validate-packet-chronology
        description: Require a future packet expiry and fresh minimized cited entries.
        task:
          type: assert
          expr: timestamp(inputs.generatedAt) < timestamp(inputs.expiresAt) && inputs.constitution.cited && inputs.constitution.minimized && timestamp(inputs.constitution.observedAt) <= timestamp(inputs.generatedAt) && inputs.entries.all(item, item.cited && item.minimized && timestamp(item.observedAt) <= timestamp(inputs.generatedAt) && timestamp(inputs.generatedAt) < timestamp(item.expiresAt) && timestamp(item.expiresAt) <= timestamp(inputs.expiresAt))
          message: Packet and entry chronology, citation, and minimization must be valid.
          severity: high
        dependsOn:
          - step: validate-dynamic-identifiers
            condition: { type: succeeded }
        weight: 0
        allowFailure: false
      - name: constitution
        description: Persist only the compact durable policy artifact defined by the configured compiler.
        task:
          type: model_method
          modelIdOrName: '${{ inputs.contextCompilerModel }}'
          methodName: compileConstitution
          inputs:
            constitution: '${{ inputs.constitution }}'
            replayPolicy: '${{ inputs.replayPolicy }}'
            authorityAttestation: '${{ inputs.authorityAttestation }}'
        dependsOn:
          - step: validate-packet-chronology
            condition: { type: succeeded }
        weight: 0
        allowFailure: false
      - name: operating-packet
        description: Compile the fresh, cited current packet from caller-provided minimized entries.
        task:
          type: model_method
          modelIdOrName: '${{ inputs.contextCompilerModel }}'
          methodName: compileOperatingPacket
          inputs:
            packetId: '${{ inputs.packetId }}'
            generatedAt: '${{ inputs.generatedAt }}'
            expiresAt: '${{ inputs.expiresAt }}'
            entries: '${{ inputs.entries }}'
            contentAttestation: '${{ inputs.contentAttestation }}'
            replayPolicy: '${{ inputs.replayPolicy }}'
            authorityAttestation: '${{ inputs.authorityAttestation }}'
        dependsOn:
          - step: constitution
            condition: { type: succeeded }
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
